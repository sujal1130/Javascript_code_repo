<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AnimeVerse • Premium Anime (2026 Mix)</title>
  <meta name="description" content="AnimeVerse — premium anime catalogue with Netflix vibe, API search, hero slider, modal, trailer lightbox, infinite scroll & My List" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Rowdies:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ========== GLOBAL ========== */
    :root{
      --bg:#070708;
      --panel:#0f1114;
      --muted:#9aa6b2;
      --accent:#e50914;
      --accent-2:#ff4b6e;
      --glass: rgba(255,255,255,0.03);
      --card-radius:14px;
      --maxw:1280px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:"Poppins",system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      background: linear-gradient(180deg,#050506,#0b0b0b 40%);
      color:#eef3f8;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;justify-content:center;padding:22px;
    }
    .app{width:100%;max-width:var(--maxw)}

    /* ========== NAVBAR ========== */
    nav{
      display:flex;align-items:center;justify-content:space-between;
      gap:18px;padding:14px 18px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);
      border:1px solid rgba(255,255,255,0.03);backdrop-filter: blur(6px);
      box-shadow:0 6px 28px rgba(2,6,23,0.6);
      position:sticky;top:16px;z-index:60;margin-bottom:18px;
    }
    .brand{display:flex;align-items:center;gap:12px}
    .logo{
      width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-weight:800;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#07101a;font-size:20px;
      box-shadow:0 10px 30px rgba(229,9,20,0.12);
    }
    .brand h1{font-size:20px;margin:0;font-family:'Rowdies',sans-serif}
    .brand small{display:block;color:var(--muted);font-size:12px;margin-top:-2px}

    .nav-actions{display:flex;align-items:center;gap:10px}
    .search{
      display:flex;align-items:center;gap:10px;background:var(--glass);padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,0.03);
      min-width:340px;
    }
    .search input{background:transparent;border:0;outline:0;color:inherit;font-size:14px;width:100%}
    .nav-btn{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit;cursor:pointer}
    .nav-btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));border:0;color:#07101a;font-weight:700}

    .profile{display:flex;align-items:center;gap:10px;position:relative}
    .avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid var(--accent);cursor:pointer}
    .avatar img{width:100%;height:100%;object-fit:cover;display:block}
    .dropdown{position:absolute;right:0;top:54px;background:#0b0b0b;border-radius:10px;padding:6px;border:1px solid rgba(255,255,255,0.03);display:none;min-width:160px}
    .dropdown a{display:block;color:#fff;padding:8px 10px;text-decoration:none;border-radius:6px}
    .dropdown a:hover{background:var(--accent);color:#07101a}

    /* ========== HERO SLIDER (big poster) ========== */
    .hero{
      width:100%;height:66vh;max-height:520px;border-radius:12px;overflow:hidden;position:relative;margin-bottom:18px;
      background:linear-gradient(180deg, rgba(0,0,0,0.45), transparent);
      border:1px solid rgba(255,255,255,0.03);
    }
    .hero-track{display:flex;height:100%;transition:transform .7s cubic-bezier(.2,.9,.2,1);will-change:transform}
    .hero-item{min-width:100%;height:100%;position:relative;background-size:cover;background-position:center}
    .hero-item::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,6,23,0.55),transparent)}
    .hero-meta{position:absolute;left:40px;bottom:40px;z-index:10;max-width:58%}
    .hero-meta h2{font-size:42px;margin:0;letter-spacing:0.3px}
    .hero-meta p{color:var(--muted);margin-top:10px;font-size:15px}
    .hero-meta .cta{margin-top:16px;display:flex;gap:10px}
    .cta .btn{padding:12px 18px;border-radius:999px;border:0;cursor:pointer;font-weight:700}
    .btn.play{background:rgba(0,0,0,0.55);border:2px solid rgba(255,255,255,0.06);color:#fff}
    .btn.watch{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#07101a}
    .hero-controls{position:absolute;right:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:15}
    .hero-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.08);cursor:pointer}
    .hero-dot.active{background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 6px 20px rgba(229,9,20,0.12)}

    /* sakura petals / neon glows small decorative */
    .decor-petal{position:absolute;pointer-events:none;opacity:0.95;filter:drop-shadow(0 8px 30px rgba(229,9,20,0.08))}

    /* ========== CONTROLS (filters / search / sort) ========== */
    .controls-bar{display:flex;align-items:center;gap:12px;justify-content:space-between;margin:18px 0;flex-wrap:wrap}
    .left-controls{display:flex;gap:8px;align-items:center}
    .chip{padding:8px 12px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,255,255,0.03);cursor:pointer}
    .chip.active{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#07101a;font-weight:700}
    .right-controls{display:flex;gap:10px;align-items:center}

    /* ========== GRID ========== */
    .grid{
      display:grid;grid-template-columns:repeat(4,1fr);gap:18px;
    }
    .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.03);cursor:pointer;transition:transform .22s, box-shadow .22s}
    .card:hover{transform:translateY(-8px);box-shadow:0 22px 40px rgba(2,6,23,0.6)}
    .card .thumb{height:320px;background-size:cover;background-position:center;position:relative}
    .card .overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(2,6,23,0.6));display:flex;flex-direction:column;justify-content:flex-end;padding:12px;opacity:0;transition:opacity .18s}
    .card:hover .overlay{opacity:1}
    .card .title{padding:12px 14px;font-weight:700}
    .meta-row{padding:0 14px 12px 14px;display:flex;justify-content:space-between;color:var(--muted);font-size:13px}

    /* small badge */
    .badge{background:linear-gradient(90deg,var(--accent),var(--accent-2));padding:6px 10px;border-radius:999px;color:#07101a;font-weight:800;font-size:13px}

    /* ========== LOADER ========== */
    .loader-wrap{display:grid;place-items:center;padding:22px}
    .loader{display:grid;place-items:center;position:relative;width:120px;height:120px}
    .ring{position:absolute;border-radius:50%;border:3px solid transparent;border-top-color:var(--accent);animation:spin 1s linear infinite}
    .ring.r2{width:90px;height:90px;border-top-color:#ff4b4b;animation:spin 1.4s linear infinite}
    .ring.r3{width:120px;height:120px;border-top-color:#ff7a7a;animation:spin 1.9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ========== MODAL DETAILS ========== */
    .modal-backdrop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(2,6,23,0.6),rgba(2,6,23,0.9));z-index:120;padding:28px}
    .modal-backdrop.open{display:flex}
    .modal{width:min(1100px,96%);background:linear-gradient(180deg,rgba(255,255,255,0.01),transparent);border-radius:12px;padding:16px;border:1px solid rgba(255,255,255,0.04);display:grid;grid-template-columns:420px 1fr;gap:16px}
    .modal .poster{height:420px;border-radius:10px;background-size:cover;background-position:center}
    .modal h3{margin:0;font-size:20px}
    .modal .desc{color:var(--muted);margin-top:12px;line-height:1.5}
    .modal .actions{margin-top:12px;display:flex;gap:10px}

    /* ========== LIGHTBOX TRAILER ========== */
    .lightbox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.92);z-index:9999;padding:18px}
    .lightbox.open{display:flex}
    .lightbox .frame{width:min(1100px,95%);height:min(640px,85%);background:#000;border-radius:10px;overflow:hidden}

    /* ========== MY LIST (localStorage) ========= */
    .mylist-count{font-weight:800;color:var(--accent);}

    /* ========== FOOTER ========== */
    footer{margin-top:22px;padding:24px;border-radius:10px;text-align:center;color:var(--muted);font-size:13px;border:1px solid rgba(255,255,255,0.02);}

    /* ========== RESPONSIVE ========== */
    @media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}.hero-meta h2{font-size:36px}}
    @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.search{min-width:200px}.hero{height:52vh}}
    @media(max-width:480px){.grid{grid-template-columns:1fr}.hero-meta{left:18px;right:18px;max-width:unset}.hero-meta h2{font-size:20px}}
  </style>
</head>
<body>
  <div class="app">
    <!-- NAV -->
    <nav>
      <div class="brand">
        <div class="logo">AV</div>
        <div>
          <h1>AnimeVerse</h1>
          <small>Premium Anime • 2026 Mix</small>
        </div>
      </div>

      <div class="nav-actions">
        <div class="search" title="Search anime">
          <!-- search icon (SVG) -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <input id="globalSearch" placeholder="Search anime, genre, year..." />
        </div>

        <div class="nav-btn" id="themeToggle" title="Toggle theme">Theme</div>
        <div class="nav-btn primary" id="topPicksBtn">Top Picks</div>

        <div class="profile">
          <div class="avatar" id="avatarBtn"><img src="" alt="profile"></div>
          <div class="dropdown" id="profileDropdown">
            <a id="menuMyList">My List (<span id="mylistCount">0</span>)</a>
            <a id="menuSettings">Settings</a>
            <a id="menuLogout">Logout</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- HERO (slider) -->
    <section class="hero" id="hero">
      <div class="hero-track" id="heroTrack" aria-live="polite"></div>
      <div class="hero-controls" id="heroDots"></div>
      <!-- decorative petals -->
      <img class="decor-petal" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='48' height='48'%3E%3Cpath d='M24 2c0 0 6 6 2 12-4 6-12 6-14 12-2 6 10 6 14 2' fill='%23ffb6c1' stroke='%23ff7aa0' stroke-width='1'/%3E%3C/svg%3E' style="left:6%;top:6%;" />
      <img class="decor-petal" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='36' height='36'%3E%3Cpath d='M18 2c0 0 5 5 2 10-3 5-9 5-11 10-2 5 8 5 11 2' fill='%23ffdce6' stroke='%23ff7aa0' stroke-width='0.8'/%3E%3C/svg%3E' style="right:6%;top:18%;" />
    </section>

    <!-- Filters + controls -->
    <div class="controls-bar">
      <div class="left-controls" id="genreChips"></div>
      <div class="right-controls">
        <select id="sortSelect" class="chip" aria-label="Sort">
          <option value="popular">Sort: Popular</option>
          <option value="title">Sort: Title</option>
          <option value="year">Sort: Year</option>
        </select>
        <div class="chip" id="toggleInfinite">Infinite: On</div>
      </div>
    </div>

    <!-- Grid / results -->
    <div id="resultsSection">
      <div id="loader" class="loader-wrap" style="display:none"><div class="loader"><div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div></div></div>
      <div class="grid" id="animeGrid" aria-live="polite"></div>
      <div style="text-align:center;margin:18px;"><button id="loadMore" class="nav-btn" style="display:none">Load more</button></div>
    </div>

    <!-- Modal detail -->
    <div class="modal-backdrop" id="modal">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div>
          <div class="poster" id="modalPoster" style="background:#111"></div>
        </div>
        <div>
          <h3 id="modalTitle">Title</h3>
          <div style="margin-top:6px;color:var(--muted)" id="modalSub">Year • Genres • Score</div>
          <div class="desc" id="modalDesc">Description...</div>
          <div class="actions">
            <button class="nav-btn primary" id="modalPlay">▶ Play Trailer</button>
            <button class="nav-btn" id="modalAdd">+ Add to My List</button>
            <button class="nav-btn" id="modalClose">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Lightbox for trailer -->
    <div class="lightbox" id="lightbox">
      <div class="frame" id="lightboxFrame"></div>
    </div>

    <!-- footer -->
    <footer>
      © 2025 <strong>AnimeVerse</strong> — Made with ❤️ for otaku. • Local MyList stored in browser.
    </footer>
  </div>

  <script>
    /* ============================
       AnimeVerse • JS (single-file)
       Gujarati + English comments
       ============================ */

    // DOM refs
    const heroTrack = document.getElementById('heroTrack');
    const heroDots = document.getElementById('heroDots');
    const animeGrid = document.getElementById('animeGrid');
    const loader = document.getElementById('loader');
    const modal = document.getElementById('modal');
    const modalPoster = document.getElementById('modalPoster');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const modalSub = document.getElementById('modalSub');
    const modalPlay = document.getElementById('modalPlay');
    const modalAdd = document.getElementById('modalAdd');
    const modalClose = document.getElementById('modalClose');
    const lightbox = document.getElementById('lightbox');
    const lightboxFrame = document.getElementById('lightboxFrame');
    const globalSearch = document.getElementById('globalSearch');
    const avatarBtn = document.getElementById('avatarBtn');
    const profileDropdown = document.getElementById('profileDropdown');
    const mylistCount = document.getElementById('mylistCount');
    const toggleInfinite = document.getElementById('toggleInfinite');
    const loadMoreBtn = document.getElementById('loadMore');
    const sortSelect = document.getElementById('sortSelect');
    const genreChips = document.getElementById('genreChips');
    const topPicksBtn = document.getElementById('topPicksBtn');

    // State
    let heroItems = [];      // hero slider data
    let items = [];          // current loaded items
    let page = 1;            // Jikan pagination page
    let perPage = 16;        // items / page
    let query = '';          // search query
    let activeGenre = 'All';
    let infinite = true;
    let isLoading = false;
    let myList = JSON.parse(localStorage.getItem('animeverse_mylist') || '[]');

    // Update my list count
    function updateMyListCount(){ mylistCount.textContent = myList.length; }
    updateMyListCount();

    // Utility: show/hide loader
    function showLoader(){ loader.style.display='grid'; }
    function hideLoader(){ loader.style.display='none'; }

    // Simple placeholder generator (SVG data URI) for offline/hero fallbacks
    function placeholder(title){
      const w=1200,h=700;
      const bg='#07101a', a1='#e50914', a2='#ff7a7a';
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}'><defs><linearGradient id='g' x1='0' x2='1'><stop offset='0' stop-color='${a2}' stop-opacity='0.18'/><stop offset='1' stop-color='${a1}' stop-opacity='0.08'/></linearGradient></defs><rect width='100%' height='100%' fill='${bg}'/><rect width='100%' height='40%' y='60%' fill='url(#g)'/><text x='50%' y='52%' fill='white' font-size='48' font-family='Rowdies, Inter, Arial' text-anchor='middle' dominant-baseline='middle' opacity='0.98'>${title}</text></svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    /* ========== FETCH / API (Jikan) ==========
       Decision: use Jikan API (https://api.jikan.moe/v4)
       - search by q param
       - /anime endpoint supports page & limit
       - We'll implement pagination + infinite scroll
    */
    async function fetchAnime({q='', page=1, limit=16}){
      isLoading = true;
      showLoader();
      try{
        // if query empty, call popular endpoint by season? fallback: search for popular "best" keyword
        const url = q
          ? `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(q)}&page=${page}&limit=${limit}`
          : `https://api.jikan.moe/v4/top/anime?page=${page}`; // top anime when no query
        const res = await fetch(url);
        if(!res.ok) throw new Error('Network error');
        const data = await res.json();
        isLoading = false;
        hideLoader();
        return (data.data || []).map(a=>({
          id: a.mal_id || (a.uid||Math.random()),
          title: a.title || a.title_english || 'Untitled',
          image: (a.images && a.images.jpg && a.images.jpg.large_image_url) || (a.image_url) || placeholder(a.title || 'Poster'),
          synopsis: a.synopsis || a.summary || '',
          score: a.score || 0,
          year: (a.year || (a.aired && a.aired.from && (new Date(a.aired.from)).getFullYear()) || ''),
          genres: (a.genres || a.themes || []).map(g=>g.name).slice(0,4)
        }));
      }catch(err){
        console.error('fetchAnime error', err);
        isLoading = false;
        hideLoader();
        return [];
      }
    }

    /* ========== RENDER HERO ========== */
    function renderHero(items){
      heroItems = items.slice(0,5); // cap
      heroTrack.innerHTML = '';
      heroDots.innerHTML = '';
      heroItems.forEach((it, idx) => {
        const div = document.createElement('div');
        div.className = 'hero-item';
        div.style.backgroundImage = `url('${it.image}')`;
        div.innerHTML = `<div class="hero-meta">
          <h2>${escapeHtml(it.title)}</h2>
          <p>${escapeHtml(it.genres.join(' • '))} • ${it.year || ''} • ⭐ ${it.score || 'N/A'}</p>
          <div class="cta"><button class="btn play" data-id="${it.id}">▶ Trailer</button><button class="btn watch" data-id="${it.id}">Watch</button></div>
        </div>`;
        heroTrack.appendChild(div);

        const dot = document.createElement('div');
        dot.className = 'hero-dot' + (idx===0 ? ' active' : '');
        dot.dataset.index = idx;
        dot.addEventListener('click', ()=> { gotoHero(idx); });
        heroDots.appendChild(dot);
      });
      startHeroAuto();
    }

    // hero slider behavior
    let heroIndex = 0, heroTimer;
    function gotoHero(idx){
      heroIndex = idx % heroItems.length;
      heroTrack.style.transform = `translateX(-${heroIndex * 100}%)`;
      Array.from(heroDots.children).forEach((d,i)=>d.classList.toggle('active', i===heroIndex));
    }
    function startHeroAuto(){
      clearInterval(heroTimer);
      heroTimer = setInterval(()=> {
        heroIndex = (heroIndex + 1) % heroItems.length;
        gotoHero(heroIndex);
      }, 5000);
    }

    // global click for play buttons inside hero (delegation)
    heroTrack.addEventListener('click', (e)=>{
      const btn = e.target.closest('.btn');
      if(!btn) return;
      const id = btn.dataset.id;
      if(btn.classList.contains('play')) openTrailerById(id);
      else if(btn.classList.contains('watch')) openDetailsById(id);
    });

    /* ========== RENDER GRID ========== */
    function renderGrid(list, append=false){
      if(!append) animeGrid.innerHTML = '';
      const frag = document.createDocumentFragment();
      list.forEach(it=>{
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = `
          <div class="thumb" style="background-image:url('${it.image}')">
            <div class="overlay">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <div class="badge">⭐ ${it.score?it.score.toFixed(1):'N/A'}</div>
                <div style="display:flex;gap:8px">
                  <button class="nav-btn" data-id="${it.id}" data-action="details">Details</button>
                  <button class="nav-btn primary" data-id="${it.id}" data-action="trailer">▶</button>
                </div>
              </div>
            </div>
          </div>
          <div class="title">${escapeHtml(it.title)}</div>
          <div class="meta-row"><div>${it.year || ''}</div><div style="color:var(--muted)">${escapeHtml(it.genres.join(' • '))}</div></div>
        `;
        // interaction
        card.querySelectorAll('button[data-action]').forEach(btn=>{
          btn.addEventListener('click', (e)=>{
            e.stopPropagation();
            const action = btn.dataset.action;
            const id = btn.dataset.id;
            if(action==='trailer') openTrailerById(id);
            else openDetailsById(id);
          });
        });
        card.addEventListener('click', ()=> openDetailsById(it.id));
        frag.appendChild(card);
      });
      animeGrid.appendChild(frag);
    }

    // 'escapeHtml' small helper
    function escapeHtml(s){ return String(s||'').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    /* ========== DETAILS MODAL ========== */
    let lastOpenItem = null;
    function openDetailsById(id){
      // prefer items[] cached
      const it = items.find(x=>String(x.id)===String(id)) || heroItems.find(x=>String(x.id)===String(id));
      if(!it){
        // fallback: fetch single => but Jikan single endpoint exists; lightly show placeholder
        lastOpenItem = {id, title:'Unknown', image: placeholder('Unknown'), synopsis:'No info.'};
      } else lastOpenItem = it;
      modalPoster.style.backgroundImage = `url('${lastOpenItem.image}')`;
      modalTitle.textContent = lastOpenItem.title;
      modalDesc.textContent = lastOpenItem.synopsis || 'No synopsis available.';
      modalSub.textContent = `${(lastOpenItem.genres||[]).join(' • ')} • ${lastOpenItem.year || ''} • ⭐ ${lastOpenItem.score || 'N/A'}`;
      modalAdd.textContent = myList.some(x=>x.id==lastOpenItem.id) ? '✓ In My List' : '+ Add to My List';
      modal.classList.add('open');
      document.body.style.overflow='hidden';
    }

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e)=>{ if(e.target===modal) closeModal(); });
    function closeModal(){ modal.classList.remove('open'); document.body.style.overflow='auto'; }

    modalAdd.addEventListener('click', ()=>{
      if(!lastOpenItem) return;
      if(!myList.some(x=>x.id==lastOpenItem.id)){
        myList.push(lastOpenItem);
        localStorage.setItem('animeverse_mylist', JSON.stringify(myList));
        modalAdd.textContent = '✓ In My List';
        updateMyListCount();
      } else {
        myList = myList.filter(x=>x.id!=lastOpenItem.id);
        localStorage.setItem('animeverse_mylist', JSON.stringify(myList));
        modalAdd.textContent = '+ Add to My List';
        updateMyListCount();
      }
    });

    /* ========== TRAILER LIGHTBOX ==========
       Jikan doesn't provide trailers; but each anime object may contain trailer.youtube_id in original API.
       We will attempt to open youtube via id (if exists in cache) — else open search on youtube
    */
    function openTrailerById(id){
      // find in cache
      const it = items.find(x=>String(x.id)===String(id)) || heroItems.find(x=>String(x.id)===String(id));
      // try to fetch trailers from Jikan single endpoint
      (async ()=>{
        showLoader();
        try{
          const res = await fetch(`https://api.jikan.moe/v4/anime/${id}/videos`);
          const j = await res.json();
          hideLoader();
          const youtube = (j.data && j.data.trailer && j.data.trailer.youtube_id) ? j.data.trailer.youtube_id : null;
          const trailerUrl = youtube ? `https://www.youtube.com/embed/${youtube}?autoplay=1` : `https://www.youtube.com/results?search_query=${encodeURIComponent((it&&it.title)||'anime trailer')}`;
          openLightbox(trailerUrl);
        }catch(e){
          hideLoader();
          const fallback = `https://www.youtube.com/results?search_query=${encodeURIComponent((it&&it.title)||'anime trailer')}`;
          openLightbox(fallback);
        }
      })();
    }

    function openLightbox(url){
      lightboxFrame.innerHTML = `<iframe src="${url}" style="width:100%;height:100%;border:0" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe>`;
      lightbox.classList.add('open');
      document.body.style.overflow='hidden';
      lightbox.addEventListener('click', closeLightbox);
    }
    function closeLightbox(){ lightbox.classList.remove('open'); lightboxFrame.innerHTML=''; document.body.style.overflow='auto'; }

    /* ========== GENRE CHIPS ========== */
    function renderGenreChips(list){
      const set = new Set(['All']);
      list.forEach(it=> (it.genres||[]).forEach(g=> set.add(g)));
      genreChips.innerHTML = '';
      Array.from(set).slice(0,16).forEach(g=>{
        const el = document.createElement('div'); el.className='chip' + (g==='All' ? ' active' : '');
        el.textContent = g;
        el.addEventListener('click', ()=>{
          document.querySelectorAll('#genreChips .chip').forEach(c=>c.classList.remove('active'));
          el.classList.add('active');
          activeGenre = g;
          applyFiltersAndRender(true);
        });
        genreChips.appendChild(el);
      });
    }

    /* ========== FILTER / SORT / SEARCH logic ========== */
    function applyFiltersAndRender(resetGrid=false){
      let filtered = items.slice();
      if(query) filtered = filtered.filter(it => (it.title||'').toLowerCase().includes(query.toLowerCase()) || (it.genres||[]).join(' ').toLowerCase().includes(query.toLowerCase()));
      if(activeGenre && activeGenre!=='All') filtered = filtered.filter(it => (it.genres||[]).includes(activeGenre));
      // sort
      const s = sortSelect.value;
      if(s==='title') filtered.sort((a,b)=> (a.title||'').localeCompare(b.title||''));
      else if(s==='year') filtered.sort((a,b)=> (b.year||0)-(a.year||0));
      else filtered.sort((a,b)=> (b.score||0)-(a.score||0)); // popular by score
      // render
      renderGrid(filtered, !resetGrid); // append false default
    }

    /* ========== INFINITE SCROLL & PAGINATION ========== */
    async function loadNext(){
      if(isLoading) return;
      page++;
      const more = await fetchAnime({q: query, page, limit: perPage});
      if(more.length){
        items = items.concat(more);
        renderGrid(more, true);
      }
      // if using infinite false, show load more button
      if(!infinite) loadMoreBtn.style.display = 'block';
    }

    // infinite toggle
    toggleInfinite.addEventListener('click', ()=>{
      infinite = !infinite;
      toggleInfinite.textContent = `Infinite: ${infinite ? 'On' : 'Off'}`;
      loadMoreBtn.style.display = infinite ? 'none' : 'block';
    });

    // load more button
    loadMoreBtn.addEventListener('click', loadNext);

    // automatic infinite scroll
    window.addEventListener('scroll', ()=>{
      if(!infinite) return;
      if((window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 900) && !isLoading){
        loadNext();
      }
    });

    /* ========== SEARCH & TOP PICKS ========== */
    let searchTimeout;
    globalSearch.addEventListener('input', (e)=>{
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(()=> {
        query = globalSearch.value.trim();
        page = 1;
        items = [];
        initialLoad();
      }, 500);
    });

    topPicksBtn.addEventListener('click', ()=> {
      // quick scroll to top picks (hero items)
      window.scrollTo({top: document.querySelector('.hero').offsetTop, behavior:'smooth'});
    });

    sortSelect.addEventListener('change', ()=> applyFiltersAndRender());

    /* ========== PROFILE DROPDOWN ========== */
    avatarBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      profileDropdown.style.display = profileDropdown.style.display==='block' ? 'none' : 'block';
    });
    window.addEventListener('click', (e)=>{ if(!e.target.closest('.profile')) profileDropdown.style.display='none'; });

    // My list menu click
    document.getElementById('menuMyList').addEventListener('click', ()=>{
      // show simple modal with MyList entries
      if(!myList.length){ alert('My List empty'); return; }
      // render overlay quick
      items = myList.slice();
      renderGrid(items);
      modal.classList.remove('open');
      window.scrollTo({top: document.getElementById('animeGrid').offsetTop - 40, behavior:'smooth'});
    });

    /* ========== BOOTSTRAP: initial load ========== */
    async function initialLoad(){
      showLoader();
      page = 1;
      const firstBatch = await fetchAnime({q: query, page, limit: perPage});
      items = firstBatch.slice();
      renderGrid(items, false);
      renderHero(items);
      renderGenreChips(items);
      hideLoader();
      // if infinite disabled, show load more
      loadMoreBtn.style.display = infinite ? 'none' : 'block';
      updateMyListCount();
    }

    // on page load
    initialLoad();

    /* ========== SMALL UX: hero hover pause, ESC to close, keyboard nav ========== */
    document.addEventListener('keydown', (e)=>{
      if(e.key==='Escape'){ closeModal(); closeLightbox(); }
    });

    // keyboard left/right to navigate hero
    document.addEventListener('keydown', (e)=>{
      if(e.key==='ArrowLeft'){ gotoHero((heroIndex - 1 + heroItems.length) % heroItems.length); }
      if(e.key==='ArrowRight'){ gotoHero((heroIndex + 1) % heroItems.length); }
    });

    // close lightbox when clicking outside iframe
    lightbox.addEventListener('click', (e)=>{ if(e.target===lightbox) closeLightbox(); });

    /* ========== UTILITY: small polyfills / habit ========== */
    // Make sure avatar has a fallback (aesthetic)
    document.querySelector('.avatar img').src = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="100%" height="100%" fill="%230b0b0b"/><text x="50%" y="52%" fill="%23e50914" font-size="60" font-family="Poppins" text-anchor="middle">AV</text></svg>');

    /* ========== HELPFUL NOTES (Gujarati) ==========
       - આ ફાઇલને local માં સાચવો અને બ્રાઉઝરમાં ખોલો.
       - Jikan API બીજા હોસ્ટ પર છે; ક્યારેક rate limits/429 આવી શકે છે.
       - જો offline images ઉપયોગ કરવા છે તો `it.image` ને તમારી images URL થી replace કરો.
       - My List localStorage માં store થાય છે: key = 'animeverse_mylist'.
       - થોડા places માં fallback data and placeholders use કર્યા છે.
    */

  </script>
</body>
</html>
