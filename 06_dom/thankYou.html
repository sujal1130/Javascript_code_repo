<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ultra Minimal Luxury Reveal</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  body{
    margin:0;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0b0b0d;
    overflow:hidden;
    font-family:Cinzel, serif;
    color:#e9e4da;
  }

  /* soft radial glow */
  .glow{
    position:absolute;
    width:1200px;
    height:1200px;
    background:radial-gradient(circle, rgba(255,238,200,0.08), transparent 70%);
    filter:blur(60px);
    animation:softMove 10s ease-in-out infinite;
  }
  @keyframes softMove{
    0%{transform:translate(-5%, -5%);} 
    50%{transform:translate(5%, 5%);} 
    100%{transform:translate(-5%, -5%);} 
  }

 /* dust particles */
.dot{
  position:absolute;
  width:4px;height:4px;       
  background:#d8c49c;
  border-radius:50%;
  opacity:.45;                
  animation:rise 7s infinite ease-in-out;
  filter:blur(1.4px);
}

@keyframes rise{
  0%{transform:translateY(0) scale(.6);opacity:.1;}
  50%{transform:translateY(-25px) scale(1);opacity:.9;}
  100%{transform:translateY(0) scale(.6);opacity:.1;}
}


  /* wrapper */
  .wrap{
    position:relative;
    z-index:5;
    text-align:center;
    width:90%;max-width:900px;
    padding:20px;
  }

  /* premium title */
  .title{
    font-family:"Great Vibes", cursive;
    font-size:90px;
    letter-spacing:3px;
    color:#f0ddba;
    opacity:0;
    transform:translateY(20px);
    transition:opacity 1s ease, transform 1s ease;
    text-shadow:0 0 20px rgba(240,221,186,0.35);
  }

  /* gold line */
  .line{
    width:0;
    height:2px;
    margin:20px auto;
    background:linear-gradient(90deg, #f0ddba, transparent);
    opacity:0;
    transition:width 1.3s ease .3s, opacity .8s ease;
  }

  /* Aesthetic shine */
  .shine {
    position: absolute;
    top: 0;
    left: -50%;
    width: 50%;
    height: 100%;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,0.55),
      transparent
    );
    transform: skewX(-18deg);
    opacity: 0;
  }

  .shine.go {
    animation: shineMove 1.8s ease;
  }

  @keyframes shineMove {
    0% { left: -40%; opacity: 0; }
    20% { opacity: .9; }
    100% { left: 140%; opacity: 0; }
  }

  .hint {
    margin-top: 25px;
    font-size: 16px;
    color: rgba(255,255,255,0.35);
    font-family: sans-serif;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="glow"></div>

<!-- gold dots random -->
<script>
for(let i=0;i<30;i++){
  let d=document.createElement('div');
  d.className='dot';
  d.style.left=Math.random()*100+'vw';
  d.style.top=Math.random()*100+'vh';
  d.style.animationDelay=(Math.random()*4)+'s';
  document.body.appendChild(d);
}
</script>

<div class="wrap">
  <div id="title" class="title"></div>
  <div id="linefx" class="line"></div>
  <div class="shine" id="shine"></div>
  <div class="hint">Press <strong>Enter</strong> to Reveal</div>
</div>

<script>
  const text = "Thank You Everyone";
  const title = document.getElementById('title');
  const fx = document.getElementById('linefx');
  const shine = document.getElementById('shine');
  let i=0, run=false;

  document.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !run){ run=true; reveal(); }
  });

  function reveal(){
    let intv=setInterval(()=>{
      title.textContent += text[i++];
      title.style.opacity=1;
      title.style.transform='translateY(0)';

      if(i===text.length){
        clearInterval(intv);
        fx.style.width='250px';
        fx.style.opacity=1;
        shine.classList.add('go');
      }
    },110);
  }
</script>
</body>
</html>
